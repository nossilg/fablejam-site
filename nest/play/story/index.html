<style>
@font-face{font-family:"Andika";font-weight:700;font-display:swap;src:url(/fonts/Andika-Bold.ttf) format("truetype")}
:root{--ink:#2b1f1e;--cream:#fbf3e4;--paper:#fffbf2;--gold:#f0b21c;--teal:#3aa89a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;background:#f3dfa6;color:var(--ink);font-family:"Andika",system-ui,sans-serif;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button{font-family:inherit;color:inherit}
#app{position:fixed;inset:0;overflow:hidden}
.off{display:none !important}

/* ---------- shared buttons (same as the other games) ---------- */
.round{position:absolute;z-index:8;width:64px;height:64px;border-radius:50%;border:5px solid var(--ink);background:var(--paper);display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer;box-shadow:0 5px 0 var(--ink);touch-action:none}
.round svg{width:60%;height:60%}
.round:active{transform:translateY(3px);box-shadow:0 2px 0 var(--ink)}
#home{right:calc(max(10px,env(safe-area-inset-right)) + 76px);top:max(10px,env(safe-area-inset-top))}
#mute{right:max(10px,env(safe-area-inset-right));top:max(10px,env(safe-area-inset-top))}
#gate{position:absolute;z-index:8;right:max(10px,env(safe-area-inset-right));top:calc(max(10px,env(safe-area-inset-top)) + 78px);width:132px;height:46px;border-radius:23px;border:3px solid var(--ink);background:rgba(255,251,242,.92);font:700 12px/1.1 "Andika",sans-serif;color:var(--ink);padding:0 8px;overflow:hidden;cursor:pointer;touch-action:none;text-align:center}
#gate i{position:absolute;left:0;top:0;bottom:0;width:0;background:#9ad7cf}
#gate span{position:relative}
body.portrait #home{right:auto;top:auto;left:max(10px,env(safe-area-inset-left));bottom:max(10px,env(safe-area-inset-bottom))}
body.portrait #mute{top:auto;bottom:max(10px,env(safe-area-inset-bottom))}
body.portrait #gate{top:auto;right:auto;left:50%;margin-left:-66px;bottom:max(16px,env(safe-area-inset-bottom))}
#curtain{position:absolute;inset:0;background:#fffbf2;opacity:0;pointer-events:none;transition:opacity .4s;z-index:20}

/* ---------- the picker ---------- */
#pick{position:absolute;inset:0;z-index:2;background:linear-gradient(rgba(255,244,214,.62),rgba(255,244,214,.62)),#f3dfa6 url(img/bg-tree.webp) 62% 50%/cover no-repeat}
#rows{position:absolute;left:max(12px,env(safe-area-inset-left));top:12px;right:196px;bottom:12px;display:flex;flex-direction:column;justify-content:space-evenly;gap:10px}
.row{flex:1;min-height:0;display:flex;align-items:center;gap:10px}
.tag{flex:none;width:clamp(40px,7vmin,64px);height:clamp(40px,7vmin,64px);border-radius:50%;background:var(--paper);border:4px solid var(--ink);display:flex;align-items:center;justify-content:center}
.tag svg{width:66%;height:66%}
.cards{flex:1;min-width:0;height:100%;display:flex;gap:clamp(6px,1.4vmin,16px);align-items:center;justify-content:center}
.card{position:relative;flex:1 1 0;min-width:0;max-width:280px;height:100%;max-height:260px;padding:0;border-radius:22px;border:5px solid var(--ink);background:#fff;overflow:hidden;cursor:pointer;touch-action:none;box-shadow:0 6px 0 var(--ink);transition:transform .15s}
.card:active{transform:translateY(3px)}
.card img{position:absolute;pointer-events:none;-webkit-user-drag:none}
.card .nm{position:absolute;left:0;right:0;bottom:0;padding:3px 2px 4px;background:rgba(255,251,242,.88);font-size:clamp(11px,2.2vmin,18px);line-height:1.1;text-align:center;border-top:3px solid var(--ink);z-index:2}
.card.who img{left:50%;bottom:26px;top:auto;height:calc(100% - 38px);width:auto;transform:translateX(-50%)}
.card.where img{inset:0;width:100%;height:100%;object-fit:cover}
.card.what img{left:50%;bottom:26px;height:calc(100% - 44px);width:auto;transform:translateX(-50%)}
.card.what svg{position:absolute;left:50%;bottom:30px;height:calc(100% - 50px);width:auto;max-width:90%;transform:translateX(-50%)}
.card .ck{position:absolute;right:6px;top:6px;width:34px;height:34px;border-radius:50%;background:var(--gold);border:4px solid var(--ink);display:none;align-items:center;justify-content:center;z-index:3}
.card .ck svg{width:70%;height:70%}
.card.sel{border-color:var(--ink);outline:8px solid var(--gold);outline-offset:-1px;box-shadow:0 6px 0 var(--ink),0 0 22px 4px rgba(240,178,28,.7);animation:bounce .5s ease-out}
.card.sel .ck{display:flex}
.card.hop{animation:bounce .22s ease-out}
.cb1{background:#f9dfaa}.cb2{background:#f6d0d6}.cb3{background:#d9e6a9}.cb4{background:#f6e07a}.cb5{background:#f6b8a8}.cb6{background:#bcd9ef}.cb7{background:#cfe8b0}
@keyframes bounce{0%{transform:scale(.88)}45%{transform:scale(1.1)}75%{transform:scale(.97)}100%{transform:scale(1)}}
#bar{position:absolute;z-index:3;right:max(10px,env(safe-area-inset-right));width:176px;top:150px;bottom:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}
.big{position:relative;border-radius:50%;border:6px solid var(--ink);background:var(--paper);box-shadow:0 7px 0 var(--ink);cursor:pointer;padding:0;touch-action:none;display:flex;align-items:center;justify-content:center}
.big:active{transform:translateY(4px);box-shadow:0 3px 0 var(--ink)}
#dice{width:72px;height:72px}
#dice svg{width:62%;height:62%}
#play{width:112px;height:112px;background:#5cc06a}
#play svg{width:56%;height:56%;margin-left:8%}
.grp{display:flex;flex-direction:column;align-items:center;gap:7px}
.cap{font-size:15px;line-height:1.1;text-align:center;color:var(--ink);text-shadow:0 0 6px #fff,0 0 6px #fff}
#playg{visibility:hidden}
#playg.on{visibility:visible;animation:popin .55s ease-out}
#playg.on #play{animation:wob 2.6s ease-in-out .6s infinite}
@keyframes popin{0%{transform:scale(0)}60%{transform:scale(1.18)}100%{transform:scale(1)}}
@keyframes wob{50%{transform:scale(1.07)}}
#dice.roll svg{animation:spin .9s ease-in-out}
@keyframes spin{to{transform:rotate(360deg)}}
body.portrait #rows{right:max(12px,env(safe-area-inset-right));bottom:204px;top:12px}
body.portrait #bar{left:0;right:0;width:auto;top:auto;bottom:74px;height:126px;flex-direction:row;gap:34px;align-items:flex-end;justify-content:center}
body.portrait #playg{order:2}
body.portrait #diceg{order:1;margin-bottom:6px}
@media (max-height:520px){#bar{top:142px}#dice{width:60px;height:60px}#play{width:92px;height:92px}.cap{font-size:13px}#bar{gap:8px}}

body.portrait .card .nm{font-size:11px}
body.portrait .tag{width:38px;height:38px;border-width:3px}
body.portrait .cards{gap:6px}

/* ---------- the scene ---------- */
#scene{position:absolute;inset:0;z-index:3;background:#bfe3f0;overflow:hidden}
#sbg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
#tint{position:absolute;inset:0;background:#5d7390;opacity:0;pointer-events:none}
#sworld{position:absolute;left:0;top:0;transform-origin:0 0}
.act{position:absolute;left:0;top:0;width:0;height:0;will-change:transform,opacity;pointer-events:none}
.act img,.act svg{position:absolute;max-width:none;display:block;pointer-events:none}
#rain{position:absolute;left:0;top:0;pointer-events:none}
.fx{position:absolute;pointer-events:none;will-change:transform,opacity;left:0;top:0}
.star{width:30px;height:30px;margin:-15px 0 0 -15px;background:#ffe27a;clip-path:polygon(50% 0,62% 36%,100% 38%,70% 60%,80% 100%,50% 76%,20% 100%,30% 60%,0 38%,38% 36%)}
.heart{width:34px;height:34px;margin:-17px 0 0 -17px}
.heart svg{width:100%;height:100%;display:block}
.drop{width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;background:#9fd2f2;border:2px solid rgba(43,31,30,.6)}
.crumb{width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;background:#e0453a;border:2px solid var(--ink)}
#bubble{position:absolute;left:0;top:0;display:none;align-items:center;gap:10px;padding:8px 22px 8px 16px;background:#fff;border:6px solid var(--ink);border-radius:60px;line-height:1.05;color:var(--ink);text-align:center;pointer-events:none;z-index:4}
#bubble::after{content:"";position:absolute;left:var(--tail,50%);bottom:-30px;margin-left:-20px;border:20px solid transparent;border-top:28px solid var(--ink);border-bottom:0}
#bubble svg{width:1.1em;height:1.1em;flex:none}
#scene.paused #sbg{filter:grayscale(.55)}
#card{position:absolute;left:0;right:0;top:5%;z-index:5;display:none;flex-direction:column;align-items:center;gap:16px;pointer-events:none}
#card.on{display:flex}
#card .pane{position:relative;padding:12px 38px 16px;background:var(--paper);border:7px solid var(--ink);border-radius:36px;box-shadow:0 9px 0 var(--ink);animation:cardin .8s ease-out}
#card h2{margin:0;font-size:clamp(34px,8.6vmin,84px);line-height:1.05;white-space:nowrap}
#card h2 b{color:#d7352a}
@keyframes cardin{0%{transform:scale(.3);opacity:0}65%{transform:scale(1.07);opacity:1}100%{transform:scale(1)}}
#card .sp{position:absolute;width:32px;height:32px;margin:-16px 0 0 -16px;background:#ffd24a;clip-path:polygon(50% 0,62% 36%,100% 38%,70% 60%,80% 100%,50% 76%,20% 100%,30% 60%,0 38%,38% 36%);animation:tw 3s ease-in-out infinite}
@keyframes tw{0%,100%{transform:scale(.55) rotate(0);opacity:.45}50%{transform:scale(1.1) rotate(18deg);opacity:1}}
#again{pointer-events:auto;display:flex;align-items:center;gap:12px;padding:10px 28px 10px 14px;border-radius:50px;border:6px solid var(--ink);background:#5cc06a;box-shadow:0 7px 0 var(--ink);font-size:clamp(22px,4.6vmin,36px);font-weight:700;color:#fff;-webkit-text-stroke:.09em var(--ink);paint-order:stroke fill;cursor:pointer;touch-action:none;animation:cardin .8s ease-out .25s backwards}
#again:active{transform:translateY(4px);box-shadow:0 3px 0 var(--ink)}
#again svg{width:1.5em;height:1.5em;flex:none}
@media (prefers-reduced-motion:reduce){*{transition:none !important}.card.sel,.card.hop,#playg.on,#playg.on #play,#dice.roll svg,#card .pane,#again{animation:none !important}#card .sp{animation:none;opacity:.9;transform:none}}
</style>
</head>
<body>
<div id="app">
  <div id="pick">

    <div id="bar">

      <div class="grp" id="playg"><button class="big" id="play" aria-label="Tell me a story!"><svg viewBox="0 0 40 40"><path d="M10 5 35 20 10 35Z" fill="#fff" stroke="#2b1f1e" stroke-width="4.5" stroke-linejoin="round"/></svg></button><span class="cap">Tell me a story!</span></div>

  <button class="round" id="home" aria-label="Back to the play corner"><svg viewBox="0 0 40 40"><path d="M5 20 20 6l15 14" fill="none" stroke="#2b1f1e" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M10 19v15h20V19" fill="#f0b21c" stroke="#2b1f1e" stroke-width="4" stroke-linejoin="round"/></svg></button>

</div>
<script>
(() => {

// ---------- the choices ----------
const SVGNS = "http://www.w3.org/2000/svg";

const S = (n, ...a) => { if (!quiet && !muted) snd[n](...a); };

// ---------- the picker ----------
function buildPicker() {

    ev("munch1", S0.e0 + S0.de * .68, () => crumbs(xP - 90, gy - 120, 3)); ev("munch2", S0.e0 + S0.de * .76, () => crumbs(fx + 110, gy - 120, 3)); ev("munch3", S0.e0 + S0.de * .84, () => crumbs(xP - 90, gy - 120, 3));
    ev("bheart", S0.e0 + S0.de * .8, () => { hearts(fx + 60, gy - 300, 2); hearts(xP - 40, gy - 320, 2); });
    buckySit.style.display = ""; buckyWave.style.display = "none";
  }
  if (w === "rain") {
    const amt = ph === 0 ? 0 : sat(tm, 0, 1.3) * (ph === 2 && T > S0.e0 + S0.de ? 1 - sat(T, S0.e0 + S0.de, S0.fin + 1.8) : 1);
    const am = ph === 0 ? 0 : (T > S0.e0 + S0.de ? 1 - sat(T, S0.e0 + S0.de + .3, S0.fin + 2) : sat(tm, 0, 1.3));
    rainAmt = REDUCE ? 0 : am; $("#tint").style.opacity = (am * .28).toFixed(3);
    const C = A.cloud; C.o = am; C.x = WW * (land ? .38 : .36) + (REDUCE ? 0 : Math.sin(T * .5) * 18); C.y = land ? 160 : 190; void amt;
    if (ph === 2) {
      const bu = sat(fe, .06, .3), bx = goF(WW + 260, xc + 40 + 194 + 0, bu);
      const fX = xc + 40, bX = fX + 194; void bx;
      const bxx = goF(WW + 260, bX, bu);
      B.o = REDUCE ? fadeIn(te, S0.de * .06, .6) : 1; B.x = bxx; B.y = gy; if (!REDUCE && bu > 0 && bu < 1) B.y += hopf(te, 3, 20);
      buckySit.style.display = ""; buckyWave.style.display = "none";
      const L = A.leafh; L.o = B.o; L.x = bxx - 68; L.y = gy - 300 - 236; L.r = REDUCE ? 0 : Math.sin(T * 1.7) * 1.5; L.sx = L.sy = 1;
      leaf = { x: L.x, y: L.y, R: 205 };
      ev("leafsay", S0.e0 + S0.de * .5, () => { S("pops"); hearts(fX, gy - 330, 2); hearts(bX, gy - 330, 2); });
    }
  } else { rainAmt = 0; $("#tint").style.opacity = 0; }
  if (w === "friend") {
    buckySit.style.display = "none"; buckyWave.style.display = "none";
    let bx = xBk, sitting = true, by = 0;

    else {

      if (ph === 2) { bx = goF(xBk, WW * .62, sat(fe, .12, .38)); sitting = fe < .38 ? false : true; if (!REDUCE && fe > .4) by = hopf(te, 1.5, 52); }
      if (ph === 1 && fm > .3 && !REDUCE) by = hopf(tm, .9, 10);
      (ph === 2 && fe < .34 ? buckyWave : buckySit).style.display = "";
      if (ph === 2 && fe >= .34) { buckySit.style.display = ""; buckyWave.style.display = "none"; }
      if (ph === 1) { buckySit.style.display = ""; buckyWave.style.display = "none"; }

    if (ph === 1) { const fb = sat(fm, .55, .62); if (fb > 0) showBubble("Will you be my friend?", F.x, gy - z.h - 40 + (fm < .62 ? 12 * (1 - fb) : 0)); }
    if (ph === 2) {
      if (fe > .04 && fe < .4) showBubble(HEART + "Yes!", bx, gy - 300 - 40);

      if (fe > .4 && fe < .97) { ev("h1", S0.e0 + S0.de * .42, () => hearts((F.x + bx) / 2, gy - 340, 3)); ev("h2", S0.e0 + S0.de * .62, () => hearts((F.x + bx) / 2, gy - 340, 3)); ev("h3", S0.e0 + S0.de * .82, () => hearts((F.x + bx) / 2, gy - 340, 3)); }

  // the closing card
  const done = T >= S0.fin; if (done) { if (!once.card) { once.card = 1; $("#card").classList.add("on"); S("pops"); if (!REDUCE) { sparkle(WW * .5, 120, 10, 200); } } }

function cardSparks() {
  const pane = $("#card .pane"); if (pane.querySelector(".sp")) return;
  [[-2, 10], [102, 6], [8, 108], [96, 100], [50, -10], [50, 112], [-4, 56], [104, 54]].forEach(([l, t], i) => { const s = document.createElement("span"); s.className = "sp"; s.style.left = l + "%"; s.style.top = t + "%"; s.style.animationDelay = (-i * .38) + "s"; pane.appendChild(s); });
}

// ---------- frame loop ----------
let clock = 0;
function step(dt) {
  clock += dt;
  if (story) {
    if (!paused) {
      T += dt;
      if (T >= story.m0 && !once.m) { once.m = 1; playClip(story.mid); }
      if (T >= story.e0 && !once.e) { once.e = 1; playClip(story.end); }
      pose(T);
    }
    if (!paused) { stepParts(dt); stepRain(dt); }
  }
}
let last = 0, frozen = false;
function frame(ms) { const now = ms / 1000, dt = Math.min(.05, last ? now - last : .016); last = now; step(dt); if (!frozen) requestAnimationFrame(frame); }

// ---------- buttons ----------
$("#play").addEventListener("pointerdown", (e) => { e.preventDefault(); audioStart(); if (picks.who && picks.where && picks.what) startStory(); });
$("#play").addEventListener("click", (e) => { if (e.detail === 0 && picks.who && picks.where && picks.what) { audioStart(); startStory(); } });
$("#again").addEventListener("pointerdown", (e) => { e.preventDefault(); audioStart(); leaveStory(); });
$("#again").addEventListener("click", (e) => { if (e.detail === 0) leaveStory(); });
for (const ev2 of ["pointerdown", "touchend", "click"]) document.addEventListener(ev2, () => audioStart(), { passive: true });
$("#mute").addEventListener("pointerdown", (e) => {
  e.preventDefault(); muted = !muted; audioStart(); if (master) master.gain.value = muted ? 0 : .55;
  if (muted) { jet.pause(); } else if (story && !once.card) { try { jet.play().catch(() => {}); } catch (_) {} }
  if (story) { paused = muted; $("#scene").classList.toggle("paused", muted); }
  $("#m-on").style.display = muted ? "none" : ""; $("#m-off").style.display = muted ? "" : "none"; $("#mute").setAttribute("aria-pressed", muted); $("#mute").setAttribute("aria-label", muted ? "Sound off" : "Sound on");
});
$("#home").addEventListener("pointerdown", (e) => { e.preventDefault(); jet.pause(); story = null; $("#curtain").style.opacity = 1; setTimeout(() => location.assign("/nest/play/"), 250); });
// the grown-up gate: press and hold three seconds (goes to the grown-ups' page; nothing else leaves the play corner)
(() => {
  const g = $("#gate"), bar = g.querySelector("i"); let t0 = 0, raf = 0;
  const tick = () => { const u = (performance.now() - t0) / 3000; bar.style.width = clamp(u) * 100 + "%"; if (u >= 1) { t0 = 0; location.assign("/nest/"); return; } raf = requestAnimationFrame(tick); };
  const stop = () => { cancelAnimationFrame(raf); t0 = 0; bar.style.width = "0"; };
  g.addEventListener("pointerdown", (e) => { e.preventDefault(); e.stopPropagation(); try { g.setPointerCapture(e.pointerId); } catch (_) {} t0 = performance.now(); tick(); });
  for (const e of ["pointerup", "pointercancel", "lostpointercapture"]) g.addEventListener(e, stop);
  g.addEventListener("contextmenu", (e) => e.preventDefault());
  g.addEventListener("keydown", (e) => { if (e.key === "Enter" && e.shiftKey) location.assign("/nest/"); });
})();
document.addEventListener("contextmenu", (e) => e.preventDefault());
document.addEventListener("gesturestart", (e) => e.preventDefault());

// ---------- start ----------
let demoOn = false;
buildPicker(); cardSparks();
const imgs = ["bg-tree.webp", "bg-nest.webp", "bg-brook.webp", "crumb-go.webp", "pearl-idle.webp", "dot-idle.webp", "ej-wave.webp", "bucky-sit.webp", "bucky-wave.webp", "berry-red.svg"];
Promise.all(imgs.map((n) => new Promise((r) => { const im = new Image(); im.onload = im.onerror = r; im.src = "img/" + n; }))).then(() => {
  layout();
  const d = Q.get("demo");
  // screenshot helper: ?demo=picked | open | mid-berry | mid-rain | mid-friend | end-berry | end-rain | end-friend | card  &who=&where=  &t=seconds into that part
  // every value is only compared with, or looked up in, the fixed tables below, and the time is clamped
  const DEMOS = Object.assign(Object.create(null), { picked: ["pick"], open: ["open"], card: ["card"], "mid-berry": ["mid", "berry"], "mid-rain": ["mid", "rain"], "mid-friend": ["mid", "friend"], "end-berry": ["end", "berry"], "end-rain": ["end", "rain"], "end-friend": ["end", "friend"] });
  if (d && DEMOS[d]) {

    const pick = (list, v, dflt) => { const o = list.find((x) => x.k === v); return o ? o.k : dflt; };
    const who = pick(WHO, Q.get("who"), "crumb"), where = pick(WHERE, Q.get("where"), "tree"), what = DEMOS[d][1] || pick(WHAT, Q.get("what"), "berry");
    choose("who", who, false); choose("where", where, false); choose("what", what, false);
    const t = Math.min(40, Math.max(0, parseFloat(Q.get("t")) || 0)), kind = DEMOS[d][0];
