<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'none'; media-src 'self'; frame-src 'none'; object-src 'none'; form-action 'none'; base-uri 'none'">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Jam Nest Sound Board · Fable Jam Nest</title>
<meta name="description" content="Tap the friends in the Jam Nest to hear their sounds, and tap the record to start the jam. A play-corner game with no ads, no sign-ups and nothing collected.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#3a2415">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<script src="crate/crate.js"></script>
<style>
@font-face{font-family:"Andika";font-weight:700;font-display:swap;src:url(/fonts/Andika-Bold.ttf) format("truetype")}
:root{--ink:#2b1f1e;--paper:#fffbf2;--gold:#f0b21c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;background:#3a2415;color:var(--ink);font-family:"Andika",system-ui,sans-serif;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#app{position:fixed;inset:0;overflow:hidden}
#stage{position:absolute;left:0;top:0;width:100%;height:100%;overflow:hidden;background:#2b1a10}
#world{position:absolute;left:0;top:0;width:2752px;height:1536px;transform-origin:0 0}
#world img.bg{position:absolute;left:0;top:0;width:2752px;height:1536px;display:block;pointer-events:none}
.item{position:absolute;left:0;top:0;width:0;height:0;transform-origin:0 0;pointer-events:none;will-change:transform}
.item img{position:absolute;display:none;max-width:none;pointer-events:none}
.item.gg img,.item.jet img{filter:drop-shadow(0 0 7px rgba(255,236,190,.75))}
.hit{position:absolute;left:0;top:0;border-radius:50%;cursor:pointer;z-index:9000;touch-action:none;outline:none}
.hit:focus-visible{box-shadow:0 0 0 8px rgba(255,255,255,.8)}
.fx{position:absolute;left:0;top:0;pointer-events:none;will-change:transform,opacity}
#disc{position:absolute;left:0;top:0;width:330px;height:72px;margin:-36px 0 0 -165px;border-radius:50%;pointer-events:none;opacity:0;background:conic-gradient(rgba(255,255,255,.28) 0 14deg,transparent 14deg 180deg,rgba(255,255,255,.28) 180deg 194deg,transparent 194deg 360deg);transition:opacity .4s}
#disc.on{opacity:1;animation:spin 1.6s linear infinite}
@keyframes spin{to{transform:translate(1867px,997px) rotate(360deg)}}
/* HUD */
.round{position:absolute;z-index:6;width:64px;height:64px;border-radius:50%;border:5px solid var(--ink);background:var(--paper);display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer;box-shadow:0 5px 0 var(--ink);touch-action:none}
.round svg{width:60%;height:60%}
.round:active{transform:translateY(3px);box-shadow:0 2px 0 var(--ink)}
#mute{right:max(10px,env(safe-area-inset-right));top:max(10px,env(safe-area-inset-top))}
#home{right:calc(max(10px,env(safe-area-inset-right)) + 76px);top:max(10px,env(safe-area-inset-top))}
#gate{position:absolute;z-index:6;right:calc(max(10px,env(safe-area-inset-right)) + 152px);top:calc(max(10px,env(safe-area-inset-top)) + 9px);width:132px;height:46px;border-radius:23px;border:3px solid var(--ink);background:rgba(255,251,242,.94);font:700 12px/1.1 "Andika",sans-serif;color:var(--ink);padding:0 8px;overflow:hidden;cursor:pointer;touch-action:none;text-align:center}
#gate i{position:absolute;left:0;top:0;bottom:0;width:0;background:#9ad7cf}
#gate span{position:relative}
/* portrait: scene on top, friend buttons below */
#panel{display:none;position:absolute;left:0;right:0;bottom:0;background:linear-gradient(#5a3a22,#3a2415);border-top:6px solid var(--ink);z-index:4}
body.portrait #panel{display:block}
#pads{position:absolute;left:0;right:0;top:0;bottom:120px;align-content:center;display:grid;grid-template-columns:repeat(5,var(--pad));justify-content:center;gap:16px 10px}
.pad{width:var(--pad);height:var(--pad);border-radius:50%;border:4px solid var(--ink);background:var(--paper);padding:5px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 0 var(--ink);cursor:pointer;touch-action:none}
.pad img{max-width:100%;max-height:100%;pointer-events:none}
.pad:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.pad.rec{grid-column:3;width:calc(var(--pad)*1.3);height:calc(var(--pad)*1.3);margin:2px calc(var(--pad)*-.15);background:#d7352a}
.pad.rec svg{width:80%;height:80%}
body.portrait #home{right:auto;top:auto;left:max(10px,env(safe-area-inset-left));bottom:max(10px,env(safe-area-inset-bottom))}
body.portrait #mute{top:auto;bottom:max(10px,env(safe-area-inset-bottom))}
body.portrait #gate{top:auto;right:auto;left:50%;margin-left:-66px;bottom:max(16px,env(safe-area-inset-bottom))}
#curtain{position:absolute;inset:0;background:#fffbf2;opacity:0;pointer-events:none;transition:opacity .4s;z-index:20}

/* ---- record crate, now-playing window, controls ---- */
#dimbg{position:absolute;left:0;top:0;width:2752px;height:1536px;background:rgba(8,10,44,.6);opacity:0;transition:opacity 2s;pointer-events:none}
body.bed #dimbg{opacity:1}
body.bed #panel{filter:brightness(.62);transition:filter 2s}
body.bed #items{filter:brightness(.8) saturate(.9);transition:filter 2s}
#np{position:absolute;left:1292px;top:126px;width:800px;height:780px;z-index:8500;pointer-events:none;opacity:0;transition:opacity .6s;text-align:center;color:#fff3cf;text-shadow:0 0 18px rgba(255,214,120,.55),0 3px 0 rgba(20,22,60,.9),0 0 3px rgba(20,22,60,.9)}
#np.on{opacity:1}
#np .lab{position:absolute;left:340px;top:50px;width:120px;height:120px;border-radius:50%;background:#2b1f1e center/cover;border:5px solid #fff3cf;box-shadow:0 0 0 6px #2b1f1e,0 0 30px rgba(255,214,120,.5)}
#np .lab::after{content:"";position:absolute;left:50%;top:50%;width:18px;height:18px;margin:-9px;border-radius:50%;background:#20233f;border:3px solid #fff3cf}
#np.spin .lab{animation:spin2 5s linear infinite}
@keyframes spin2{to{transform:rotate(360deg)}}
#np .ttl{position:absolute;left:100px;width:600px;top:186px;font:700 44px/1.1 "Andika",sans-serif}
#np .stars{position:absolute;left:0;width:800px;top:262px;height:36px;display:flex;justify-content:center;gap:10px}
.stars b{width:30px;height:30px;display:block;background:rgba(255,243,207,.28);clip-path:polygon(50% 0,62% 36%,100% 38%,70% 60%,80% 98%,50% 76%,20% 98%,30% 60%,0 38%,38% 36%);transition:background .5s}
.stars b.f{background:#ffd257}
#np .lyr{position:absolute;left:60px;width:680px;top:312px;font:700 60px/1.12 "Andika",sans-serif}
.lyr span,#lyrbar span{display:inline-block;margin:0 .12em;color:rgba(255,243,207,.62);transition:color .15s,transform .15s}
.lyr span.on,#lyrbar span.on{color:#ffc93a;text-shadow:0 0 16px rgba(255,190,60,.8),0 3px 0 rgba(20,22,60,.9)}
.lyr span.now,#lyrbar span.now{transform:scale(1.12)}
body.bed #np{color:#d9dcf2;text-shadow:0 0 12px rgba(150,170,255,.4),0 2px 0 rgba(20,22,60,.9)}
body.bed .stars b.f{background:#c9d2ff}
body.bed #np .lab{opacity:.75;animation-duration:12s}
#lyrbar{display:none;position:absolute;left:0;right:0;top:0;height:78px;flex-wrap:wrap;align-content:center;align-items:center;justify-content:center;text-align:center;padding:4px 10px;font:700 24px/1.15 "Andika",sans-serif;color:#fff3cf;background:rgba(20,22,60,.55);z-index:2}
body.portrait.lyrics #lyrbar{display:flex}
body.portrait.lyrics #pads{top:84px}
body.lyrics #np .lyr{display:block}
body.portrait.lyrics #np .lyr{display:none}
#crate{position:absolute;left:0;top:0;width:260px;height:200px;margin:-200px 0 0 -130px}
#ctl{position:absolute;z-index:7;left:50%;bottom:max(14px,env(safe-area-inset-bottom));display:none;gap:16px;transform:translateX(-50%)}
body.playing #ctl,body.hasplayed #ctl{display:flex}
body.portrait #ctl{bottom:calc(max(10px,env(safe-area-inset-bottom)) + 62px)}
#ctl .round{position:relative;width:76px;height:76px}
#ctl .round[aria-pressed=true]{background:#ffd257}
#shelf{position:absolute;inset:0;z-index:15;background:rgba(18,12,30,.84);display:none;overflow-y:auto;overflow-x:hidden;touch-action:pan-y;-webkit-overflow-scrolling:touch;padding:max(84px,calc(env(safe-area-inset-top) + 80px)) 16px 40px}
#shelf.on{display:block}
#shelf .in{max-width:1100px;margin:0 auto}
#shelf h2{margin:22px 4px 10px;font:700 18px/1 "Andika",sans-serif;color:#f6e7c1;display:flex;align-items:center;gap:10px}
#shelf h2 svg{width:28px;height:28px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:18px 14px}
.card{display:block;border:0;background:none;padding:0;font:inherit;color:#fffbf2;cursor:pointer;text-align:center;touch-action:pan-y;animation:fan .5s cubic-bezier(.2,.9,.3,1.2) both;animation-delay:calc(var(--i)*45ms)}
.card .rec{position:relative;display:block;border-radius:14px;border:4px solid #fffbf2;box-shadow:0 6px 0 rgba(0,0,0,.55);overflow:hidden;background:#2b1f1e;aspect-ratio:16/9}
.card img{width:100%;height:100%;display:block;object-fit:cover;pointer-events:none}
.card .rec::after{content:"";position:absolute;right:8px;bottom:8px;width:34px;height:34px;border-radius:50%;background:radial-gradient(circle,#f0b21c 0 22%,#2b1f1e 24% 100%);border:3px solid #fffbf2}
.card:active .rec{transform:translateY(3px);box-shadow:0 3px 0 rgba(0,0,0,.55)}
.card.cur .rec{border-color:#ffd257;box-shadow:0 0 0 4px #ffd257,0 6px 0 rgba(0,0,0,.55)}
.card span.t{display:block;margin-top:8px;font:700 13px/1.2 "Andika",sans-serif;color:#e9dcc2}
@keyframes fan{from{opacity:0;transform:translateY(60px) rotate(calc((var(--i) - 3)*5deg)) scale(.7)}to{opacity:1;transform:none}}
#shelf .x,#shelf .mn{position:fixed;top:max(12px,env(safe-area-inset-top));width:64px;height:64px;z-index:16}
#shelf .x{right:max(10px,env(safe-area-inset-right))}
#shelf .mn{left:max(10px,env(safe-area-inset-left))}
#shelf .mn[aria-pressed=true]{background:#c9d2ff}
#lab{position:absolute;left:0;top:0;width:150px;height:34px;margin:-17px 0 0 -75px;border-radius:50%;background:#2b1f1e center/cover;border:3px solid #fffbf2;opacity:0;pointer-events:none;z-index:8400;transition:opacity .3s}
@media (orientation:landscape) and (max-height:520px){
#ctl{left:max(10px,env(safe-area-inset-left));top:50%;bottom:auto;transform:translateY(-50%);flex-direction:column;gap:10px}
#ctl .round{width:62px;height:62px}
body.land #gate{top:auto;right:max(10px,env(safe-area-inset-right));bottom:max(10px,env(safe-area-inset-bottom))}
}
@media (prefers-reduced-motion:reduce){#disc.on,#np.spin .lab,.card{animation:none !important}*{transition:none !important}}
</style>
</head>
<body>
<div id="app">
  <div id="stage"><div id="world">
    <img class="bg" src="img/bg.webp" alt="" draggable="false">
    <div id="dimbg"></div>
    <div id="disc"></div><div id="lab"></div>
    <div id="np"><div class="lab"></div><div class="ttl"></div><div class="stars"></div><div class="lyr"></div></div>
    <div id="items"></div>
    <div id="hits"></div>
  </div></div>
  <div id="panel"><div id="lyrbar"></div><div id="pads"></div></div>
  <button class="round" id="home" aria-label="Back to the play corner"><svg viewBox="0 0 40 40"><path d="M5 20 20 6l15 14" fill="none" stroke="#2b1f1e" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M10 19v15h20V19" fill="#f0b21c" stroke="#2b1f1e" stroke-width="4" stroke-linejoin="round"/></svg></button>
  <button class="round" id="mute" aria-label="Sound on" aria-pressed="false"><svg viewBox="0 0 40 40"><path d="M6 15h7l9-7v24l-9-7H6z" fill="#2b1f1e"/><g id="m-on" fill="none" stroke="#2b1f1e" stroke-width="4" stroke-linecap="round"><path d="M27 14q5 6 0 12"/><path d="M31 9q9 11 0 22"/></g><path id="m-off" d="M26 13l10 14M36 13 26 27" stroke="#d7352a" stroke-width="4.5" stroke-linecap="round" style="display:none"/></svg></button>
  <button id="gate" aria-label="Grown-ups only. Press and hold for three seconds to go back to the Fable Jam Nest page."><i></i><span>Grown-ups: press and hold to leave</span></button>
  <div id="ctl">
    <button class="round" id="pp" aria-label="Pause"><svg viewBox="0 0 40 40"><g id="pp-pause"><rect x="10" y="8" width="7" height="24" rx="2" fill="#2b1f1e"/><rect x="23" y="8" width="7" height="24" rx="2" fill="#2b1f1e"/></g><path id="pp-play" d="M12 7l21 13-21 13z" fill="#3aa58e" stroke="#2b1f1e" stroke-width="3" stroke-linejoin="round" style="display:none"/></svg></button>
    <button class="round" id="stop" aria-label="Stop the music"><svg viewBox="0 0 40 40"><rect x="9" y="9" width="22" height="22" rx="4" fill="#d7352a" stroke="#2b1f1e" stroke-width="3"/></svg></button>
    <button class="round" id="next" aria-label="Next song"><svg viewBox="0 0 40 40"><path d="M8 8l16 12L8 32z" fill="#2b1f1e"/><rect x="27" y="8" width="5" height="24" rx="2" fill="#2b1f1e"/></svg></button>
    <button class="round" id="loop" aria-label="Play them all" aria-pressed="false"><svg viewBox="0 0 40 40"><path d="M9 17v-2a6 6 0 0 1 6-6h14m0 0-4-4m4 4-4 4M31 23v2a6 6 0 0 1-6 6H11m0 0 4 4m-4-4 4-4" fill="none" stroke="#2b1f1e" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <button class="round" id="shuffle" aria-label="Shuffle the songs" aria-pressed="false"><svg viewBox="0 0 40 40"><path d="M6 13h6c6 0 10 14 16 14h6M6 27h6c2.4 0 4.4-2.2 6.2-5M22 18c1.8-2.8 3.8-5 6-5h6m0 0-4-4m4 4-4 4M34 27l-4-4m4 4-4 4" fill="none" stroke="#2b1f1e" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  </div>
  <div id="shelf"><button class="round x" id="shut" aria-label="Close the crate"><svg viewBox="0 0 40 40"><path d="M10 10l20 20M30 10 10 30" stroke="#2b1f1e" stroke-width="6" stroke-linecap="round"/></svg></button>
    <button class="round mn" id="moonbtn" aria-label="Bedtime songs" aria-pressed="false"><svg viewBox="0 0 40 40"><path d="M27 6a15 15 0 1 0 8 22A12 12 0 0 1 27 6z" fill="#f0b21c" stroke="#2b1f1e" stroke-width="3" stroke-linejoin="round"/></svg></button>
    <div class="in" id="shelfin"></div></div>
  <div id="curtain"></div>
</div>
<script>
(() => {
"use strict";
const Q = new URLSearchParams(location.search);   // only for the ?demo= screenshot helper
const REDUCE = matchMedia("(prefers-reduced-motion: reduce)").matches;
const WW = 2752, WH = 1536, IMG = "img/", SND = "snd/", BPM = 115; let BEAT = 60 / BPM;
const $ = (s) => document.querySelector(s);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const eio = (u) => u * u * (3 - 2 * u), eout = (u) => 1 - (1 - u) * (1 - u);
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = (a) => a[Math.floor(Math.random() * a.length)];

// ---------- the cast: where they stand (feet x, y in the 2752x1536 picture), how tall, which clip ----------
// the clips are the kids' echoes cut from Mike's roll-call take (see snd/CLIPS.txt)
const CAST = [
  { id: "gg",    name: "Gee-Gee",     x: 560,  y: 1420, h: 310, poses: ["gg-idle", "gg-fly"],            clip: "think",  dance: "think"  },
  { id: "pearl", name: "Pearl",       x: 790,  y: 1445, h: 330, poses: ["pearl-idle", "pearl-flap"],     clip: "coo",    dance: "flap"   },
  { id: "pops",  name: "Pops",        x: 1085, y: 1475, h: 330, poses: ["pops-idle", "pops-wave"],       clip: "pop",    dance: "pop"    },
  { id: "dot",   name: "Dot",         x: 862,  y: 850,  h: 160, poses: ["dot-idle", "dot-cheer"],        clip: "tiptap", dance: "tiptap" },
  { id: "crumb", name: "Crumb",       x: 1320, y: 1115, h: 300, poses: ["crumb-catch", "crumb-go"],      clip: "squeak", dance: "hop"    },
  { id: "jet",   name: "Jet",         x: 1545, y: 1100, h: 280, poses: ["jet-idle", "jet-oh"],           clip: "plink",  dance: "plink"  },
  { id: "jammo", name: "Jammo",       x: 2215, y: 1485, h: 290, poses: ["jammo-idle"],                   clip: "jingle", dance: "sway"   },
  { id: "moe",   name: "Moe",         x: 2390, y: 1510, h: 470, poses: ["moe-idle", "moe-laugh"],        clip: "he",     dance: "laugh"  },
  { id: "ej",    name: "E.J.",        x: 2462, y: 868,  h: 170, poses: ["ej-sit", "ej-wave", "ej-cheer"], clip: "peep",   dance: "wave"   },
  { id: "moon",  name: "Little Moon", x: 1700, y: 735,  h: 400, poses: ["moon"], center: true,             clip: "shine",  dance: "shine"  },
];
const PAD_ORDER = ["gg", "jet", "crumb", "pearl", "moe", "pops", "jammo", "dot", "ej", "moon"];
const REC = { x: 1650, y: 950, w: 460, h: 190 };          // the record player on the crate

// ---------- assets ----------
const imgNames = ["bg"]; for (const c of CAST) imgNames.push(...c.poses);
const nat = {};
const loaded = Promise.all(imgNames.map((n) => new Promise((res) => { const im = new Image(); im.onload = im.onerror = () => { nat[n] = { w: im.naturalWidth || 100, h: im.naturalHeight || 100 }; res(); }; im.src = IMG + n + ".webp"; })));

// ---------- sound: short mp3 clips (a few copies of each so quick taps overlap); nothing starts before a tap ----------
let muted = false, started = false;
const CLIPS = {};
function clip(name, copies) { const l = []; for (let i = 0; i < copies; i++) { const a = new Audio(SND + name + ".mp3"); a.preload = "auto"; l.push(a); } return { l, i: 0 }; }
for (const c of CAST) CLIPS[c.clip] = clip(c.clip, 3);
const CHORUS = new Audio(SND + "chorus.mp3"); CHORUS.preload = "auto";
function playClip(name) {
  if (muted) return; const c = CLIPS[name]; const a = c.l[c.i++ % c.l.length];
  try { a.currentTime = 0; a.volume = playing ? .45 : .95; a.play().catch(() => {}); } catch (e) {}
}

// ---------- scene ----------
const world = $("#world"), itemsEl = $("#items"), hitsEl = $("#hits"), disc = $("#disc");
let clock = 0;                       // seconds; everything animates from this, so ?demo=...&t=... can jump to a moment
const items = {};
function build() {
  for (const c of CAST) {
    const box = document.createElement("div"); box.className = "item " + c.id; itemsEl.appendChild(box);
    const kids = {};
    c.poses.forEach((p) => {
      const im = document.createElement("img"); im.src = IMG + p + ".webp"; im.alt = ""; im.draggable = false;
      const w = nat[p].w * (c.h / nat[p].h), h = c.h;
      im.style.width = w + "px"; im.style.height = h + "px"; im.style.left = -w / 2 + "px"; im.style.top = (c.center ? -h / 2 : -h) + "px";
      box.appendChild(im); kids[p] = im;
    });
    box.style.zIndex = Math.round(c.y);
    const it = { c, box, kids, cur: null, w: nat[c.poses[0]].w * (c.h / nat[c.poses[0]].h), anim: null, phase: Math.random() * 6 };
    items[c.id] = it; show(it, c.poses[0]);
    const hit = document.createElement("div"); hit.className = "hit"; hit.tabIndex = 0; hit.setAttribute("role", "button"); hit.setAttribute("aria-label", c.name);
    hit.addEventListener("pointerdown", (e) => { e.preventDefault(); tap(c.id); });
    hit.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); tap(c.id); } });
    hitsEl.appendChild(hit); it.hit = hit;
  }
  // E.J.'s nest: a back and a front, drawn in code, with E.J. between them
  const nestSvg = (front) => `<svg width="300" height="170" viewBox="0 0 300 170" style="position:absolute;left:-150px;top:-100px">${front
    ? `<g fill="none" stroke-linecap="round"><path d="M14 80Q150 190 286 80" stroke="#6e4524" stroke-width="30"/><path d="M20 78Q150 175 280 78" stroke="#a9733c" stroke-width="16"/><path d="M30 86Q150 178 270 86" stroke="#8a5a30" stroke-width="9"/><path d="M26 70Q80 120 150 128" stroke="#c28a4c" stroke-width="6"/><path d="M274 70Q220 120 150 128" stroke="#c28a4c" stroke-width="6"/><path d="M60 100Q120 150 200 132" stroke="#5a381d" stroke-width="7"/><path d="M40 90Q150 160 262 94" stroke="#d4a15e" stroke-width="4"/></g>`
    : `<ellipse cx="150" cy="75" rx="138" ry="62" fill="#4a2c18"/><ellipse cx="150" cy="68" rx="112" ry="42" fill="#2e1a0e"/>`}</svg>`;
  const ej = CAST.find((c) => c.id === "ej");
  for (const front of [false, true]) { const d = document.createElement("div"); d.className = "item"; d.innerHTML = nestSvg(front); d.style.transform = `translate(${ej.x}px,${ej.y + 28}px)`; d.style.zIndex = Math.round(ej.y) + (front ? 2 : -1); itemsEl.appendChild(d); }

  const g = $("#gate"), bar = g.querySelector("i"); let t0 = 0, raf = 0;
  const tick = () => { const u = (performance.now() - t0) / 3000; bar.style.width = clamp(u) * 100 + "%"; if (u >= 1) { t0 = 0; location.assign("/nest/"); return; } raf = requestAnimationFrame(tick); };
  const stop = () => { cancelAnimationFrame(raf); t0 = 0; bar.style.width = "0"; };
  g.addEventListener("pointerdown", (e) => { e.preventDefault(); try { g.setPointerCapture(e.pointerId); } catch (_) {} t0 = performance.now(); tick(); });
  for (const ev of ["pointerup", "pointercancel", "lostpointercapture"]) g.addEventListener(ev, stop);
  g.addEventListener("contextmenu", (e) => e.preventDefault());
})();
document.addEventListener("contextmenu", (e) => e.preventDefault());
document.addEventListener("gesturestart", (e) => e.preventDefault());

// ---------- layout: whole picture on a landscape screen; on a phone held upright, the picture on top and a big button for every friend below ----------
let S = 1;
function layout() {
  const vw = innerWidth, vh = innerHeight, land = vw / vh >= 1.15;
  document.body.classList.toggle("land", land); document.body.classList.toggle("portrait", !land);
  const stage = $("#stage"), panel = $("#panel"); let s, x0, y0, sh = vh;
  if (land) {
    s = Math.max(vw / WW, vh / WH); x0 = 1376 - vw / (2 * s); y0 = 768 - vh / (2 * s); stage.style.height = "100%";
  } else {
    const win = 2380; s = vw / win; sh = Math.min(vh - 330, 1330 * s); x0 = 1430 - win / 2; y0 = 1536 - sh / s - 20;
    stage.style.height = sh + "px"; panel.style.top = sh + "px";
    const pad = clamp((vw - 60) / 5 - 10, 58, 92); panel.style.setProperty("--pad", pad + "px");
  }
  x0 = clamp(x0, 0, WW - vw / s); y0 = clamp(y0, 0, WH - sh / s); S = s;
  world.style.transform = `scale(${s}) translate(${-x0}px,${-y0}px)`;
  // tap areas are never smaller than a thumb (64 px on the screen), whatever the picture's size
  const minW = 72 / s;
  for (const id in items) {
    const it = items[id]; if (!it.c) continue; const c = it.c;
    const w = Math.max(it.w * .8, minW), h = Math.max(c.h * .9, minW), cy = c.center ? c.y : c.y - c.h * .5;
    Object.assign(it.hit.style, { width: w + "px", height: h + "px", transform: `translate(${c.x - w / 2}px,${cy - h / 2}px)` });
  }
  { const w = Math.max(300, minW), h = Math.max(230, minW); Object.assign(items.crate.hit.style, { width: w + "px", height: h + "px", transform: `translate(${CRATE_POS.x - w / 2}px,${CRATE_POS.y - 115 - h / 2}px)` }); }
  const rw = Math.max(REC.w, minW), rh = Math.max(REC.h, minW);
  Object.assign(items.rec.hit.style, { width: rw + "px", height: rh + "px", transform: `translate(${REC.x + REC.w / 2 - rw / 2}px,${REC.y + REC.h / 2 - rh / 2}px)` });
}
addEventListener("resize", layout); addEventListener("orientationchange", layout);
function buildPads() {
  const pads = $("#pads");
  for (const id of PAD_ORDER) {
    const c = items[id].c, b = document.createElement("button"); b.className = "pad"; b.setAttribute("aria-label", c.name);
    const im = document.createElement("img"); im.src = IMG + c.poses[0] + ".webp"; im.alt = ""; im.draggable = false; b.appendChild(im);
    b.addEventListener("pointerdown", (e) => { e.preventDefault(); tap(id); }); pads.appendChild(b);
  }
  const r = document.createElement("button"); r.className = "pad rec"; r.setAttribute("aria-label", "Open the record crate");
  r.innerHTML = `<svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="17" fill="#2b1f1e"/><circle cx="20" cy="20" r="12" fill="none" stroke="#6b5444" stroke-width="1.5"/><circle cx="20" cy="20" r="6" fill="#f0b21c"/><circle cx="20" cy="20" r="1.5" fill="#2b1f1e"/></svg>`;
  r.addEventListener("pointerdown", (e) => { e.preventDefault(); openCrate(); }); pads.appendChild(r);
}

loaded.then(() => {
  build(); buildPads(); layout();
  // screenshot helper: ?demo=<id|all|beat>&t=<seconds after the tap>   (ids: gg jet crumb pearl moe pops jammo dot ej moon); add &run=1 to keep playing
  const d = Q.get("demo");
  if (d) {
    const t = parseFloat(Q.get("t") || "0");
    startAudio = () => {}; const noPlay = () => {}; CHORUS.play = () => Promise.resolve();
    for (const k in CLIPS) CLIPS[k].l.forEach((a) => { a.play = () => Promise.resolve(); });
    MUSIC.play = () => Promise.resolve(); if (Q.get("n") !== null && (d === "play" || d === "bed")) { play(+Q.get("n")); demoT = 0; }
    if (d === "crate" || d === "moon") { openCrate(d === "moon"); $("#shelf").querySelectorAll(".card").forEach((c) => { c.style.animation = "none"; }); }
    if (d === "play" || d === "bed") { demoT = clock; }
    else if (d === "all") PAD_ORDER.forEach((id) => tap(id)); else if (d === "beat") { record(); } else if (items[d]) tap(d);
    const n = Math.round(t * 60); for (let i = 0; i < n; i++) { clock += 1 / 60; render(); }
    render(); if (!Q.get("run")) frozen = true;
  }
  requestAnimationFrame(frame); document.documentElement.dataset.ready = "1";
});
})();
</script>
