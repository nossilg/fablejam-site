<style>
@font-face{font-family:"Andika";font-weight:700;font-display:swap;src:url(/fonts/Andika-Bold.ttf) format("truetype")}
:root{--ink:#2b1f1e;--cream:#fbf3e4;--paper:#fffbf2;--teal:#3aa89a;--red:#d7352a;--gold:#f0b21c;--pink:#e8457a;--green:#4fae3a;--orange:#f08a24;--grass:#8cc866}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;background:var(--grass);color:var(--ink);font-family:"Andika",system-ui,sans-serif;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#app{position:fixed;inset:0;overflow:hidden}
#stage{position:absolute;left:0;top:0;width:100%;height:100%;overflow:hidden;background:#9bd3f2}
#world{position:absolute;left:0;top:0;width:2752px;height:1536px;transform-origin:0 0}
#world img.bg{position:absolute;left:0;top:0;width:2752px;height:1536px;display:block;pointer-events:none}
.lay{position:absolute;left:0;top:0;width:0;height:0}
.act{position:absolute;left:0;top:0;width:0;height:0;transform-origin:0 0;will-change:transform}

.drop{width:16px;height:16px;border-radius:50%;background:#d8f1ff;border:3px solid #7ab9e0}
.star{width:30px;height:30px;background:#ffe27a;clip-path:polygon(50% 0,62% 36%,100% 38%,70% 60%,80% 100%,50% 76%,20% 100%,30% 60%,0 38%,38% 36%);opacity:.95}
#bubble{position:absolute;left:0;top:0;display:none;align-items:center;gap:16px;padding:14px 34px 14px 22px;background:#fff;border:9px solid var(--ink);border-radius:80px;font-size:92px;line-height:1;color:var(--ink);white-space:nowrap;transform-origin:50% 100%;pointer-events:none}
#bubble::after{content:"";position:absolute;left:44px;bottom:-44px;border:28px solid transparent;border-top:38px solid var(--ink);border-bottom:0}

/* controls */
#ctrl{position:absolute;display:flex;gap:clamp(10px,2.4vw,22px);z-index:5}
.big{position:relative;flex:none;width:var(--bs);height:var(--bs);border-radius:50%;border:5px solid var(--ink);color:#fff;font:700 calc(var(--bs)*.2)/1 "Andika",sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:0;cursor:pointer;box-shadow:0 7px 0 var(--ink);transition:transform .12s,opacity .3s,filter .3s;touch-action:none;text-shadow:0 2px 0 rgba(0,0,0,.25)}

.big[data-step="1"]{background:#f08a24}

/* portrait: stage on top, grass panel with buttons below */

body.portrait #ctrl{left:0;right:0;bottom:0;justify-content:center;align-items:flex-start;padding-top:16px;--bs:clamp(84px,25vw,130px)}
body.portrait #panel{display:block}
#panel{display:none;position:absolute;left:0;right:0;bottom:0;background:linear-gradient(#a6d676,#7dbb58);border-top:6px solid var(--ink)}
body.land #ctrl{right:max(14px,env(safe-area-inset-right));top:50%;transform:translateY(-50%);flex-direction:column;--bs:clamp(68px,min(19vh,13vw),130px)}
/* top buttons */
.round{position:absolute;z-index:6;width:64px;height:64px;border-radius:50%;border:5px solid var(--ink);background:var(--paper);display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer;box-shadow:0 5px 0 var(--ink);touch-action:none}
.round svg{width:60%;height:60%}
.round:active{transform:translateY(3px);box-shadow:0 2px 0 var(--ink)}
#home{right:calc(max(10px,env(safe-area-inset-right)) + 76px);top:max(10px,env(safe-area-inset-top))}
#mute{right:max(10px,env(safe-area-inset-right));top:max(10px,env(safe-area-inset-top))}
#gate{position:absolute;z-index:6;right:max(10px,env(safe-area-inset-right));top:calc(max(10px,env(safe-area-inset-top)) + 78px);width:132px;height:46px;border-radius:23px;border:3px solid var(--ink);background:rgba(255,251,242,.92);font:700 12px/1.1 "Andika",sans-serif;color:var(--ink);padding:0 8px;overflow:hidden;cursor:pointer;touch-action:none;text-align:center}

<body>
<div id="app">
  <div id="stage"><div id="world">
    <img class="bg" id="bg" src="img/bg.webp" alt="" draggable="false">
    <div class="lay" id="L-back"></div>
    <div class="lay" id="L-crumb"></div>
    <div class="lay" id="L-plane"></div>
    <div class="lay" id="L-front"></div>
    <div id="bubble"></div>
  </div></div>
  <div id="panel"></div>
  <button class="round" id="home" aria-label="Back to the play corner"><svg viewBox="0 0 40 40"><path d="M5 20 20 6l15 14" fill="none" stroke="#2b1f1e" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M10 19v15h20V19" fill="#f0b21c" stroke="#2b1f1e" stroke-width="4" stroke-linejoin="round"/></svg></button>
  <button class="round" id="mute" aria-label="Sound on" aria-pressed="false"><svg viewBox="0 0 40 40"><path d="M6 15h7l9-7v24l-9-7H6z" fill="#2b1f1e"/><g id="m-on" fill="none" stroke="#2b1f1e" stroke-width="4" stroke-linecap="round"><path d="M27 14q5 6 0 12"/><path d="M31 9q9 11 0 22"/></g><path id="m-off" d="M26 13l10 14M36 13 26 27" stroke="#d7352a" stroke-width="4.5" stroke-linecap="round" style="display:none"/></svg></button>
  <button id="gate" aria-label="Grown-ups only. Press and hold for three seconds to go back to the Fable Jam Nest page."><i></i><span>Grown-ups: press and hold to leave</span></button>
  <div id="ctrl">
    <button class="big" data-step="0" aria-label="Ready"><svg viewBox="0 0 40 40"><path d="M6 24 34 8 26 34 20 26z" fill="#fff" stroke="#4a2f00" stroke-width="3" stroke-linejoin="round"/><path d="M20 26 34 8" stroke="#4a2f00" stroke-width="3"/></svg>Ready</button>
    <button class="big" data-step="1" aria-label="Set"><svg viewBox="0 0 40 40"><path d="M8 28 20 16l12 12M8 18 20 6l12 12" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg>Set</button>
    <button class="big" data-step="2" aria-label="Go!"><svg viewBox="0 0 40 40"><path d="M10 5 34 20 10 35z" fill="#fff" stroke="#fff" stroke-width="3" stroke-linejoin="round"/></svg>Go!</button>
  </div>
  <div id="curtain"></div>
</div>
<script>
(() => {
"use strict";
// ---------- setup ----------
const Q = new URLSearchParams(location.search);       // only used for the ?demo= screenshot helper
const REDUCE = matchMedia("(prefers-reduced-motion: reduce)").matches;
const WW = 2752, WH = 1536, IMG = "img/";
const CX = 1050, FEET = 634, GROUND = 1085, DIR = -1, DF = true, FS = 1.1;   // Crumb stands at the limb's outer end (bark top y 629 at x 1040) facing LEFT; flights go left over the meadow           // Crumb stands on the branch top (y 632 at his feet), characters on the grass
const COLS = ["", "-y", "-b"];
const $ = (s) => document.querySelector(s);
const world = $("#world"), body = document.body;
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = (a) => a[Math.floor(Math.random() * a.length)];
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, u) => a + (b - a) * u;
const eio = (u) => u * u * (3 - 2 * u);
const eout = (u) => 1 - (1 - u) * (1 - u);
const L2 = (p, q, u) => [lerp(p[0], q[0], u), lerp(p[1], q[1], u)];
const arcUp = (p, q, u, h) => [lerp(p[0], q[0], u), lerp(p[1], q[1], u) - h * 4 * u * (1 - u)];

// ---------- assets (all from this site; preloaded so it works offline once loaded) ----------
const names = ["crumb-catch", "crumb-go", "crumb-watch", "bucky-sit", "bucky-leap", "bucky-wave", "ej-sleep", "ej-lookup", "ej-cheer", "jet-up", "jet-oh", "jet-idle", "p-leaf1", "p-leaf2", "p-leaf3", "p-leaf4"];
for (const g of ["level", "climb", "dive", "bank", "inv1", "inv2", "stuck", "float"]) for (const c of COLS) names.push("glider-" + g + c);
for (const g of ["crumb-ready", "crumb-set", "crumb-wiggle", "bucky-hold", "bucky-offer"]) for (const c of COLS) names.push(g + c);
const nat = {};
const loadAll = Promise.all(names.map((n) => new Promise((res) => {
  const im = new Image(); im.onload = im.onerror = () => { nat[n] = { w: im.naturalWidth || 200, h: im.naturalHeight || 200 }; res(); }; im.src = IMG + n + ".webp";
})));

// an actor: one box in the world holding several poses (only one shown); anchor "b" = feet, "c" = centre
function actor(layer, list, k, anchor) {
  const box = document.createElement("div"); box.className = "act"; layer.appendChild(box);
  const kids = {};
  for (const n of list) {
    const im = document.createElement("img"); im.src = IMG + n + ".webp"; im.draggable = false; im.alt = "";
    const w = nat[n].w * k, h = nat[n].h * k;
    im.style.width = w + "px"; im.style.height = h + "px"; im.style.left = -w / 2 + "px"; im.style.top = (anchor === "b" ? -h : -h / 2) + "px";
    box.appendChild(im); kids[n] = im;
  }
  const a = { box, kids, cur: null, w: (n) => nat[n].w * k, h: (n) => nat[n].h * k,
    show(n) { if (a.cur === n) return; if (a.cur) kids[a.cur].style.display = "none"; kids[n].style.display = "block"; a.cur = n; },
    hide() { box.style.display = "none"; }, vis() { box.style.display = "block"; },
    set(x, y, rot = 0, flip = 1, sx = 1, sy = sx) { box.style.transform = `translate(${x.toFixed(1)}px,${y.toFixed(1)}px) rotate(${rot.toFixed(2)}deg) scale(${(flip * sx).toFixed(3)},${sy.toFixed(3)})`; } };
  return a;
}
function fxDiv(cls, x, y, w, h, layer) {
  const d = document.createElement("div"); d.className = "fx " + cls; d.style.width = w + "px"; d.style.height = h + "px"; d.style.left = -w / 2 + "px"; d.style.top = -h / 2 + "px";
  d.style.transform = `translate(${x}px,${y}px)`; (layer || LF).appendChild(d); temp.push(d); return d;
}

// ---------- sound: everything made in code, soft, only after the first tap ----------
let ax = null, master = null, muted = false;
function audioStart() {
  if (!ax) { const C = window.AudioContext || window.webkitAudioContext; if (!C) return; ax = new C(); master = ax.createGain(); master.gain.value = muted ? 0 : 0.55; master.connect(ax.destination); }
  if (ax.state === "suspended") ax.resume();
}
function tone(f, t0, d, v, f2, type = "sine") {
  if (!ax) return; const t = ax.currentTime + t0, o = ax.createOscillator(), g = ax.createGain(); o.type = type;
  o.frequency.setValueAtTime(f, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d * .8);
  g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(v, t + .015); g.gain.exponentialRampToValueAtTime(.0001, t + d);
  o.connect(g).connect(master); o.start(t); o.stop(t + d + .05);
}
let nbuf = null;
function noise(t0, d, v, type, f1, f2, q = 1) {
  if (!ax) return; if (!nbuf) { nbuf = ax.createBuffer(1, ax.sampleRate * 2, ax.sampleRate); const a = nbuf.getChannelData(0); for (let i = 0; i < a.length; i++) a[i] = Math.random() * 2 - 1; }
  const t = ax.currentTime + t0, s = ax.createBufferSource(); s.buffer = nbuf; const f = ax.createBiquadFilter(); f.type = type; f.Q.value = q;
  f.frequency.setValueAtTime(f1, t); f.frequency.exponentialRampToValueAtTime(f2, t + d);
  const g = ax.createGain(); g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(v, t + d * .3); g.gain.exponentialRampToValueAtTime(.0001, t + d);
  s.connect(f).connect(g).connect(master); s.start(t, Math.random()); s.stop(t + d + .05);
}
const snd = {
  plink() { tone(1568, 0, .18, .16); tone(3136, 0, .12, .05); },
  ready() { tone(784, 0, .16, .15, null, "triangle"); tone(1175, .09, .2, .12, null, "triangle"); },
  set() { tone(988, 0, .14, .15, null, "triangle"); tone(1319, .08, .18, .13, null, "triangle"); tone(988, .22, .14, .1, null, "triangle"); },
  go() { tone(523, 0, .12, .14, null, "triangle"); tone(784, .08, .12, .14, null, "triangle"); tone(1047, .16, .3, .14, null, "triangle"); },
  whoosh() { noise(0, .8, .22, "bandpass", 350, 1900, 1.2); },
  boing(p = 1) { tone(260 * p, 0, .5, .2, 520 * p); tone(262 * p, .0, .5, .06, 780 * p, "triangle"); },
  poof() { noise(0, .35, .3, "lowpass", 900, 200, .7); tone(180, 0, .2, .12, 90); },
  splash() { noise(0, .55, .26, "bandpass", 2400, 700, .8); for (let i = 0; i < 3; i++) tone(700 + i * 260, .12 + i * .1, .12, .09, 1300 + i * 300); },
  pop() { tone(500, 0, .09, .18, 1100); },
  breeze() { noise(0, 1.1, .2, "bandpass", 500, 1500, .6); },
  squeak() { tone(1300, 0, .09, .09, 2300); tone(1500, .12, .09, .08, 2600); },
  wow() { tone(659, 0, .14, .12, null, "triangle"); tone(880, .1, .14, .12, null, "triangle"); },
  fanfare() { [523, 659, 784, 1047].forEach((f, i) => tone(f, i * .12, .32, .1, null, "triangle")); tone(1047, .5, .5, .1, null, "triangle"); tone(1319, .5, .5, .07, null, "triangle"); },
  rustle() { noise(0, .3, .16, "highpass", 3000, 6000, .5); },
};

// ---------- timeline: cues (do once) and tweens (every frame while active) ----------
const tl = { t: 0, cues: [], tweens: [], on: false };
const cue = (t, fn) => tl.cues.push({ t, fn, done: false });
const tween = (t0, d, fn) => tl.tweens.push({ t0, d, fn, done: false });
let parts = [];            // particles
let temp = [];             // elements to clear at the end of a round
function step(dt) {
  if (!tl.on) return;
  tl.t += dt;
  for (const c of tl.cues) if (!c.done && tl.t >= c.t) { c.done = true; c.fn(); }
  for (const w of tl.tweens) if (!w.done && tl.t >= w.t0) { const u = clamp((tl.t - w.t0) / w.d); w.fn(u, dt); if (u >= 1) w.done = true; }
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i]; p.age += dt; p.vy += p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.r += p.vr * dt;
    const k = p.age / p.life, o = k > .6 ? 1 - (k - .6) / .4 : 1;
    p.el.style.opacity = clamp(o); p.el.style.transform = `translate(${p.x.toFixed(1)}px,${p.y.toFixed(1)}px) rotate(${p.r.toFixed(1)}deg)`;
    if (k >= 1) { p.el.remove(); parts.splice(i, 1); }
  }
}
function spawn(el, x, y, vx, vy, g, vr, life) { LF.appendChild(el); parts.push({ el, x, y, vx, vy, g, r: rnd(0, 360), vr, age: 0, life }); }
function leafBurst(x, y, n, power = 1) {
  const m = REDUCE ? Math.ceil(n / 2) : n;
  for (let i = 0; i < m; i++) {
    const im = document.createElement("img"); im.src = IMG + "p-leaf" + pick([1, 2, 4]) + ".webp"; im.className = "fx"; im.draggable = false; const s = rnd(.45, .8);
    im.style.width = nat["p-leaf1"].w * s + "px"; im.style.left = -nat["p-leaf1"].w * s / 2 + "px"; im.style.top = -nat["p-leaf1"].h * s / 2 + "px";
    spawn(im, x + rnd(-40, 40), y - 30, rnd(-230, 230) * power, rnd(-620, -300) * power, 520, rnd(-300, 300), rnd(1.1, 1.6));
  }
}

// ---------- the actors ----------
const LB = $("#L-back"), LC = $("#L-crumb"), LP = $("#L-plane"), LF = $("#L-front"), bubble = $("#bubble");
let crumb, planes = [], plane, colour = 0;
const crumbNames = ["crumb-catch", "crumb-go", "crumb-watch"]; for (const g of ["crumb-ready", "crumb-set", "crumb-wiggle"]) for (const c of COLS) crumbNames.push(g + c);
const GL = ["level", "climb", "dive", "bank", "inv1", "inv2", "stuck", "float"];
let hopY = 0, rock = 0, crumbSquash = 1;
function renderCrumb(now) {
  const breathe = (!tl.on && !REDUCE) ? 1 + .012 * Math.sin(now * 2.6) : 1;
  crumb.set(CX, FEET - hopY, rock, -1, 1, breathe * crumbSquash);
}
function buildActors() {
  crumb = actor(LC, crumbNames, 1, "b"); crumb.show("crumb-catch");
  for (const c of COLS) { const p = actor(LP, GL.map((g) => "glider-" + g + c), .6, "c"); p.hide(); planes.push(p); }
  bubble.innerHTML = "";
}
let pv = null, flipState = false;
const NOSE = { level: 0, climb: 27, dive: -34 };
function planeRaw(x, y, rot, flip, spr, sc = 1) { plane.show("glider-" + spr + COLS[colour]); plane.set(x, y, rot, flip ? -1 : 1, sc); }
// the usual call: facing the flight direction (left); rot is written as if flying right and gets mirrored
function planeSet(x, y, rot, _f, spr, sc = 1) { planeRaw(x, y, DIR * rot, DF, spr, sc); }
// move the plane along pos(u); heading follows the path (smoothed) unless o.rot or o.spr say otherwise
function fly(t0, d, pos, o = {}) {
  tween(t0, d, (u, dt) => {
    const p = pos(u), a = pos(Math.min(1, u + .03)), b = pos(Math.max(0, u - .03));
    const v = [a[0] - b[0], a[1] - b[1]];
    if (!pv) pv = v.slice(); else { const k = 1 - Math.exp(-dt * 11); pv[0] += (v[0] - pv[0]) * k; pv[1] += (v[1] - pv[1]) * k; }
    if (pv[0] < -10) flipState = true; else if (pv[0] > 10) flipState = false;
    if (o.rot) { planeSet(p[0], p[1], o.rot(u), 0, o.spr ? o.spr(u) : "level", o.sc ? o.sc(u) : 1); return; }
    const elev = Math.atan2(-pv[1], Math.abs(pv[0])) * 180 / Math.PI;
    let spr = "level"; if (elev > 40) spr = "climb"; else if (elev < -42) spr = "dive";
    if (o.spr) spr = o.spr(u);
    const base = o.spr ? 0 : NOSE[spr], r = elev - base;
    planeRaw(p[0], p[1], flipState ? r : -r, flipState, spr, o.sc ? o.sc(u) : 1);
  });
}
const hold = (pos) => () => pos;     // stay put

// ---------- flights (a short silly trick, then the landing starts from wherever it ended) ----------
const FLIGHTS = {
  loop(t, S) {
    const R = 105, p1 = [S[0] + DIR * FS * 140, S[1] + 40], q = [p1[0] + DIR * FS * 90, p1[1]], E = [q[0] + DIR * FS * 280, q[1] + 90];
    fly(t, .7, (u) => L2(S, p1, eio(u)));
    cue(t + .55, snd.whoosh);
    fly(t + .7, 1.4, (u) => { const f = eio(u) * 2 * Math.PI; return [p1[0] + DIR * (R * Math.sin(f) + 90 * FS * u), p1[1] - R * (1 - Math.cos(f))]; }, { rot: (u) => -360 * eio(u) });
    fly(t + 2.1, .9, (u) => L2(q, E, eio(u)));
    return { t: t + 3, E };
  },
  barrel(t, S) {
    const E = [S[0] + DIR * FS * 470, S[1] + 100];

// ---------- one round ----------
function startRound(o = {}) {

  planes.forEach((p) => p.hide()); plane = planes[colour]; plane.hide();

// ---------- camera: fit the action (x 880-1900, y 120-1130) in whatever screen this is ----------
function layout() {
  const vw = innerWidth, vh = innerHeight, land = vw / vh >= 1.15;
  body.classList.toggle("land", land); body.classList.toggle("portrait", !land);
  const stage = $("#stage"), panel = $("#panel");
  let s, x0, y0, sw = vw, sh = vh;
  if (land) {
    const pad = Math.max(120, Math.min(190, vh * .3)) ;
    s = Math.min((vw - pad) / 1100, vh / 1220);
    s = Math.max(s, vw / WW);
    x0 = 700 - ((vw - pad) / 2) / s; y0 = 650 - vh / (2 * s);
    stage.style.height = "100%"; panel.style.display = "none";
  } else {
    const ctrlH = clamp(vh * .3, 200, 270);
    s = vw / 1260; sh = Math.min(vh - ctrlH, WH * s);
    x0 = 700 - vw / (2 * s); y0 = 625 - sh / (2 * s);
    stage.style.height = sh + "px"; panel.style.display = "block"; panel.style.top = sh + "px";
    $("#ctrl").style.top = sh + "px"; $("#ctrl").style.bottom = "0";
  }
  x0 = clamp(x0, 0, WW - sw / s); y0 = clamp(y0, 0, WH - sh / s);
  world.style.transform = `scale(${s}) translate(${-x0}px,${-y0}px)`;
}
addEventListener("resize", layout); addEventListener("orientationchange", layout);

// ---------- frame loop ----------
let last = 0, frozen = false;
function frame(ms) {
  const now = ms / 1000, dt = Math.min(.05, last ? now - last : .016); last = now;
  for (let i = free.length - 1; i >= 0; i--) { const f = free[i]; f.t += dt; f.fn(clamp(f.t / f.d)); if (f.t >= f.d) { f.fn(1); hopY = 0; free.splice(i, 1); } }
  step(dt); renderCrumb(now);
  if (!frozen) requestAnimationFrame(frame);
}

loadAll.then(() => {
  buildActors(); layout(); refresh(); plane = planes[0];
  // screenshot helper: ?demo=ready|set|go  or  ?demo=1&fl=loop&ld=splash&c=y&t=3.2  (jumps straight to that moment; add &run=1 to keep playing)
  const d = Q.get("demo");
  if (d) {
    colour = Math.max(0, COLS.indexOf(Q.get("c") ? "-" + Q.get("c") : ""));
    audioStart = () => {};
    if (d === "ready") { crumb.show("crumb-ready" + COLS[colour]); state = 1; refresh(); }
    else if (d === "set") { crumb.show("crumb-set" + COLS[colour]); state = 2; refresh(); }
    else {
      state = 3; refresh();
      startRound({ fl: Q.get("fl"), ld: Q.get("ld"), instant: true });
      const T = parseFloat(Q.get("t") || "0"); for (let i = 0; i < T * 60; i++) step(1 / 60);
      if (!Q.get("run")) frozen = true;
    }
  }
  requestAnimationFrame(frame);
  if (frozen) requestAnimationFrame(() => { renderCrumb(0); });
  document.documentElement.dataset.ready = "1";
});
})();
</script>
